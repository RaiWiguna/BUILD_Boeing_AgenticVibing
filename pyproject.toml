[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atc-flowlens"
version = "0.1.0"
description = "Local, simulation-first runway training and evidence replay"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn[standard]", "pydantic>=2", "shapely>=2"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "httpx", "playwright", "ruff", "mypy", "types-shapely", "psutil"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
