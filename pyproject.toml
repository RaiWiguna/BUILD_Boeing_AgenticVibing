[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "atc-flowlens"
version = "0.1.0"
description = "Offline research replay: shared backend contracts and standalone harnesses"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.115,<1",
    "google-cloud-speech==2.41.0",
    "google-genai==2.29.0",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "httpx2>=2,<3",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "bandit>=1.8,<2",
    "pip-audit>=2.9,<3",
    "types-protobuf>=7.35.1.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/flowlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
files = ["backend/flowlens"]

